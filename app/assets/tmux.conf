# Loom's own tmux config. Loaded ONLY by the tmux server on Loom's socket
# (`tmux -L loom`, the default for new installs), never by your own tmux: Loom
# passes it with -f when it starts that server, and your ~/.tmux.conf stays in
# charge of everything else. setup.sh installs it as $LOOM_HOME/tmux.conf
# (~/.loom/tmux.conf); edit that copy and run `tmux -L loom source ~/.loom/tmux.conf`.
#
# The goal is a pane that feels like a plain terminal inside the Loom window.

# Scroll and select with the mouse/trackpad, as in any terminal.
set -g mouse on
set -g history-limit 50000

# Loom's sidebar shows names and topics, so no status bar.
set -g status off

# A window follows the size of whichever client used it last: the Loom panel,
# or an external terminal attached to the same chat.
set -g window-size latest
setw -g aggressive-resize on

# Behave like a modern terminal.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 0
set -g renumber-windows on

# Pane borders carry what Loom writes on each pane: @name (panenames.ts) and,
# while an agent runs in it, @topic behind its @stage glyph (panetopics.ts):
# ? discovery, + implementation, ^ shipping, ~ thread (your move), ! blocked.
# The version-string match on pane_current_command means a crashed session
# falls back to the bare name by itself. Borders only draw in split windows.
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=cyan
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bold],}#{?#{&&:#{@topic},#{m:[0-9]*,#{pane_current_command}}}, #{?#{==:#{@stage},discovery},#[fg=colour75]? ,#{?#{==:#{@stage},implementation},#[fg=colour114]+ ,#{?#{==:#{@stage},shipping},#[fg=colour176]^ ,#{?#{==:#{@stage},thread},#[fg=colour215]~ ,#{?#{==:#{@stage},blocked},#[fg=colour209]! ,}}}}}#[fg=default]#{@topic} #[fg=colour244]· #{@name} ,#{?@name, #{@name} ,}}#[default]"
