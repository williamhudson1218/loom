<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-9rTBHeGuA+/wkYJPEtpXoNHuwLEYQsSAt0vpOIzz8zc='; style-src 'sha256-t/WP6xWmzPHTvS2V2Apetq0AXiOUYCWzQPolrinWRUo='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Loom Slack sign-in</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#17171b;color:#e8e8ee;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:440px;padding:24px 16px}h1{font-size:18px;margin:0 0 8px}p{margin:0 0 8px;color:#b8b8c4}a{color:#8ab4ff}</style>
</head>
<body>
<main>
<h1 id="title">Returning to Loom</h1>
<p id="msg">Sending your Slack sign-in back to Loom on this Mac.</p>
<p id="fallback" hidden>If nothing happens, <a id="link" href="#">open Loom's sign-in page</a>.</p>
</main>
<script>
(function () {
  // Loom's Slack sign-in relay. Slack needs an HTTPS redirect for a public app;
  // this page only forwards Slack's answer to Loom on this Mac, on 127.0.0.1 and
  // a port in 4317-4326 read from the state Loom made ("<port>.<random>"). It
  // never forwards anywhere else. It sees the sign-in code, but the code is
  // useless without the PKCE verifier, which never leaves the Mac.
  var MIN = 4317, MAX = 4326;
  var p = new URLSearchParams(location.search);
  var m = /^([0-9]{4})\.[A-Za-z0-9_-]+$/.exec(p.get('state') || '');
  var port = m ? Number(m[1]) : 0;
  var msg = document.getElementById('msg');
  if (!(port >= MIN && port <= MAX)) {
    document.getElementById('title').textContent = 'Slack not connected';
    msg.textContent = 'This sign-in link did not come from Loom, or it is incomplete. Start Connect Slack again from Loom.';
    return;
  }
  var out = new URLSearchParams();
  ['code', 'state', 'error', 'error_description'].forEach(function (k) {
    var v = p.get(k);
    if (v !== null) out.set(k, v);
  });
  var target = 'http://127.0.0.1:' + port + '/slack/callback?' + out.toString();
  document.getElementById('link').setAttribute('href', target);
  document.getElementById('fallback').hidden = false;
  location.replace(target);
})();
</script>
</body>
</html>
