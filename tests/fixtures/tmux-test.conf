# Config for the throwaway tmux servers the tests start (instead of /dev/null).
#
# Tests open panes and close them, or kill the whole server, a few milliseconds
# later. A login zsh opens its tty by name in init_io as its first act; if the
# pane's pty master is already gone by then, that open() blocks forever on
# macOS. The shell never exits, gets reparented to launchd, and pins one of the
# kern.tty.ptmx_max (511) ptys until reboot: 400+ of them leaked this way.
# /bin/sh reads its inherited fd instead, gets EOF on a dead pty, and exits.
# It is still a shell by name, so Loom's idle-shell logic treats it as one.
set -g default-shell /bin/sh
